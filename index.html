<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR 立体磁力線シミュレータ (遠回り版)</title>
  <!-- A-Frame and AR.js libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    AFRAME.registerComponent('magnetic-field', {
      init: function () {
        this.nEl = document.querySelector('#n-pole');
        this.sEl = document.querySelector('#s-pole');
        this.linesContainer = document.querySelector('#lines-container');
        
        // 磁力線の数と、各線の分割数（滑らかさ）
        this.numLines = 10; // ほわっと感を出すために少し増やします
        this.segments = 50; 
        this.lines = [];

        for (let i = 0; i < this.numLines; i++) {
          let line = document.createElement('a-entity');
          this.linesContainer.appendChild(line);
          this.lines.push({
            entity: line,
            angle: (i / this.numLines) * Math.PI * 2
          });
        }
      },
      tick: function () {
        // 両方のマーカーが可視の場合のみ
        if (this.nEl.object3D.visible && this.sEl.object3D.visible) {
          let nPos = new THREE.Vector3();
          let sPos = new THREE.Vector3();
          
          this.nEl.object3D.getWorldPosition(nPos);
          this.sEl.object3D.getWorldPosition(sPos);

          let distance = nPos.distanceTo(sPos);

          this.lines.forEach(item => {
            // N極とS極の中心地点
            let mid = new THREE.Vector3().addVectors(nPos, sPos).multiplyScalar(0.5);
            
            // 磁力線が大きく外側へ回り込むための制御点を計算
            // 軸周りにループさせ、さらに上下（y軸）へ大きく膨らませる
            let offsetR = distance * 0.8; // 回り込む半径を大きく設定
            let offsetX = Math.cos(item.angle) * offsetR;
            let offsetZ = Math.sin(item.angle) * offsetR;
            
            // N極からS極へ繋ぐ「S字」のような3D曲線（三次ベジェ曲線）の制御点1
            let controlPoint1 = new THREE.Vector3(
              mid.x + offsetX,
              mid.y + distance * 0.6, // 上方向へ大きく膨らませる
              mid.z + offsetZ
            );
            
            // S字のような3D曲線（三次ベジェ曲線）の制御点2（N極側とは逆へ膨らませる）
            let controlPoint2 = new THREE.Vector3(
              mid.x - offsetX,
              mid.y + distance * 0.1, // こちらは少し戻す
              mid.z - offsetZ
            );

            // 【ここを修正】より遠回りする「三次ベジェ曲線」に変更
            let curve = new THREE.CubicBezierCurve3(nPos, controlPoint1, controlPoint2, sPos);
            let points = curve.getPoints(this.segments);
            
            // 線を3Dチューブ（パイプ）として描画（遠近感を出すため）
            // 遠くに行くほど細く見せるために Tube を使います
            let geometry = new THREE.TubeGeometry(curve, this.segments, 0.015, 8, false);
            
            // 材質を設定：光沢を抑え、少し半透明にして「ほわっと」させる
            let material = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6, wireframe: false });
            
            let lineMesh = new THREE.Mesh(geometry, material);
            
            // 既存のメッシュを更新
            if (item.mesh) item.entity.object3D.remove(item.mesh);
            item.mesh = lineMesh;
            item.entity.object3D.add(lineMesh);
          });
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- シーン全体にフォグ（霧）を追加して、遠くの線を薄く見せる設定 -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" fog="type: linear; color: #aaa; near: 1; far: 5">
    
    <!-- N極マーカー（Hiro） -->
    <a-marker id="n-pole" preset="hiro">
      <a-sphere radius="0.1" color="red"></a-sphere>
      <a-text value="N" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <!-- S極マーカー（Kanji） -->
    <a-marker id="s-pole" preset="kanji">
      <a-sphere radius="0.1" color="blue"></a-sphere>
      <a-text value="S" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <!-- 磁力線を空間に配置 -->
    <a-entity magnetic-field id="lines-container"></a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
