<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR 磁力線アプリ</title>
  <!-- 3Dを描くライブラリ(A-Frame)と、カメラで認識するライブラリ(AR.js)を読み込み -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    AFRAME.registerComponent('magnetic-field', {
      init: function () {
        this.nEl = document.querySelector('#n-pole');
        this.sEl = document.querySelector('#s-pole');
        this.linesContainer = document.querySelector('#lines-container');
        
        // 磁力線の数（12本にしてより綺麗な立体的に）
        this.numLines = 12;
        this.lines = [];

        for (let i = 0; i < this.numLines; i++) {
          let line = document.createElement('a-entity');
          this.linesContainer.appendChild(line);
          this.lines.push({
            entity: line,
            angle: (i / this.numLines) * Math.PI * 2
          });
        }
      },
      tick: function () {
        // 2つのマーカー（N極・S極）が両方画面に映っている時だけ描画
        if (this.nEl.object3D.visible && this.sEl.object3D.visible) {
          let nPos = new THREE.Vector3();
          let sPos = new THREE.Vector3();
          
          this.nEl.object3D.getWorldPosition(nPos);
          this.sEl.object3D.getWorldPosition(sPos);

          // N極からS極へのベクトルと距離
          let dir = new THREE.Vector3().subVectors(sPos, nPos);
          let distance = dir.length();
          if (distance === 0) return;

          // 中間地点（真ん中）
          let mid = new THREE.Vector3().addVectors(nPos, sPos).multiplyScalar(0.5);

          // N-S軸に垂直な平面上の2つの直交基底(u, v)を計算（完全な点対称・線対称を作るため）
          let normDir = dir.clone().normalize();
          let up = Math.abs(normDir.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
          let u = new THREE.Vector3().crossVectors(normDir, up).normalize();
          let v = new THREE.Vector3().crossVectors(normDir, u).normalize();

          // 磁力線の膨らみの大きさ（距離に応じて変化）
          let radius = distance * 0.35;

          this.lines.forEach(item => {
            // N-S軸を中心に円状に等間隔配置
            let offsetX = Math.cos(item.angle) * radius;
            let offsetY = Math.sin(item.angle) * radius;

            // 中間点から垂直方向に押し出した制御点
            let controlPoint = mid.clone()
              .add(u.clone().multiplyScalar(offsetX))
              .add(v.clone().multiplyScalar(offsetY));

            // N極から制御点を経由してS極へ向かう美しいベジェ曲線
            let curve = new THREE.QuadraticBezierCurve3(nPos, controlPoint, sPos);
            let points = curve.getPoints(24);
            
            // 線の描画
            let geometry = new THREE.BufferGeometry().setFromPoints(points);
            let material = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
            
            let lineMesh = new THREE.Line(geometry, material);
            
            if (item.mesh) item.entity.object3D.remove(item.mesh);
            item.mesh = lineMesh;
            item.entity.object3D.add(lineMesh);
          });
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- N極用マーカー (Hiro) -->
    <a-marker id="n-pole" preset="hiro">
      <a-sphere radius="0.08" color="#ff3333"></a-sphere>
      <a-text value="N" position="0 0.15 0" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
    </a-marker>

    <!-- S極用マーカー (Kanji) -->
    <a-marker id="s-pole" preset="kanji">
      <a-sphere radius="0.08" color="#3366ff"></a-sphere>
      <a-text value="S" position="0 0.15 0" align="center" color="white" scale="1.5 1.5 1.5"></a-text>
    </a-marker>

    <!-- 磁力線を空間に配置 -->
    <a-entity magnetic-field id="lines-container"></a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
