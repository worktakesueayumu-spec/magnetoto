<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>まぐねとと</title>
  <!-- A-Frame and AR.js libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    AFRAME.registerComponent('magnetic-field', {
      init: function () {
        this.nEl = document.querySelector('#n-pole');
        this.sEl = document.querySelector('#s-pole');
        this.linesContainer = document.querySelector('#lines-container');
        
        // 磁力線の数と、各線の分割数（チューブを滑らかにするため）
        this.numLines = 8;
        this.segments = 20; 
        this.lines = [];

        for (let i = 0; i < this.numLines; i++) {
          let line = document.createElement('a-entity');
          // チューブの材質（色、光沢）を設定
          line.setAttribute('material', 'color: cyan; metalness: 0.3; roughness: 0.7;');
          this.linesContainer.appendChild(line);
          this.lines.push({
            entity: line,
            angle: (i / this.numLines) * Math.PI * 2
          });
        }
      },
      tick: function () {
        // 両方のマーカーが可視の場合のみ
        if (this.nEl.object3D.visible && this.sEl.object3D.visible) {
          let nPos = new THREE.Vector3();
          let sPos = new THREE.Vector3();
          
          this.nEl.object3D.getWorldPosition(nPos);
          this.sEl.object3D.getWorldPosition(sPos);

          // N極からS極へのベクトル
          let vectorNS = new THREE.Vector3().subVectors(sPos, nPos);
          let distance = vectorNS.length();

          // 【科学的修正】N極の回転情報を取得して、磁力線の制御点を磁石軸基準で計算
          let q = new THREE.Quaternion();
          this.nEl.object3D.getWorldQuaternion(q);
          
          this.lines.forEach(item => {
            // N極からS極への中心地点
            let mid = new THREE.Vector3().addVectors(nPos, sPos).multiplyScalar(0.5);
            
            // 磁石軸に対する垂直方向を計算（N極の回転を考慮）
            // これで、磁石を傾けても常に磁石を囲むように膨らむ
            let perpVector = new THREE.Vector3(Math.cos(item.angle), Math.sin(item.angle), 0).applyQuaternion(q);
            
            // 制御点の膨らみ（距離に比例、最大値を設定）
            let offsetR = Math.min(distance * 0.4, 0.5);
            
            // 制御点を計算（N極基準で対称に配置）
            let controlPoint = new THREE.Vector3().addVectors(mid, perpVector.multiplyScalar(offsetR));

            // 二次ベジェ曲線（きれいな対称カーブ）を生成
            let curve = new THREE.QuadraticBezierCurve3(nPos, controlPoint, sPos);
            let points = curve.getPoints(this.segments);
            
            // 【遠近感修正】チューブ状の立体（パイプ）として描画
            let geometry = new THREE.TubeGeometry(curve, this.segments, 0.015, 8, false);
            
            // 既存のメッシュを更新
            if (item.mesh) item.entity.object3D.remove(item.mesh);
            item.mesh = new THREE.Mesh(geometry, item.entity.object3DMap.material);
            item.entity.object3D.add(item.mesh);
          });
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- 【遠近感修正】fog（霧）を追加して、奥を薄く見せる設定 -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" fog="type: exponential; color: white; density: 0.15">
    
    <!-- N極マーカー（Hiro） -->
    <a-marker id="n-pole" preset="hiro">
      <a-sphere radius="0.1" color="red"></a-sphere>
      <a-text value="N" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <!-- S極マーカー（Kanji） -->
    <a-marker id="s-pole" preset="kanji">
      <a-sphere radius="0.1" color="blue"></a-sphere>
      <a-text value="S" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <!-- 磁力線のコンテナ -->
    <a-entity magnetic-field id="lines-container"></a-entity>
    
    <!-- 【遠近感修正】ライトを追加して立体感を強調 -->
    <a-entity ambient-light="color: #666"></a-entity>
    <a-entity directional-light="color: #fff; intensity: 0.6" position="0 1 1"></a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
