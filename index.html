<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR リアル磁力線シミュレータ</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    AFRAME.registerComponent('magnetic-field', {
      init: function () {
        this.nEl = document.querySelector('#n-pole');
        this.sEl = document.querySelector('#s-pole');
        this.linesContainer = document.querySelector('#lines-container');
        
        this.numLines = 8;
        this.segments = 20; 
        this.lines = [];

        for (let i = 0; i < this.numLines; i++) {
          let line = document.createElement('a-entity');
          line.setAttribute('material', 'color: cyan; metalness: 0.3; roughness: 0.7; transparent: true; opacity: 1;');
          this.linesContainer.appendChild(line);
          this.lines.push({
            entity: line,
            angle: (i / this.numLines) * Math.PI * 2
          });
        }
      },
      tick: function () {
        // マーカーとカメラが存在するか安全に確認
        if (!this.nEl || !this.sEl) return;
        
        if (this.nEl.object3D.visible && this.sEl.object3D.visible) {
          let nPos = new THREE.Vector3();
          let sPos = new THREE.Vector3();
          
          this.nEl.object3D.getWorldPosition(nPos);
          this.sEl.object3D.getWorldPosition(sPos);

          // カメラの座標を取得（エラー防止用ガード付き）
          let camPos = new THREE.Vector3();
          if (this.el.sceneEl.camera) {
            this.el.sceneEl.camera.getWorldPosition(camPos);
          }

          let dirNS = new THREE.Vector3().subVectors(sPos, nPos);
          let distance = dirNS.length();
          if (distance === 0) return; // 0除算防止
          dirNS.normalize();

          // マーカーのすぐ端から出入り（5%オフセット）
          let poleOffsetDistance = distance * 0.05; 
          let nStartPos = new THREE.Vector3().addVectors(nPos, dirNS.clone().multiplyScalar(-poleOffsetDistance));
          let sEndPos = new THREE.Vector3().addVectors(sPos, dirNS.clone().multiplyScalar(poleOffsetDistance));

          let q = new THREE.Quaternion();
          this.nEl.object3D.getWorldQuaternion(q);
          
          this.lines.forEach(item => {
            let mid = new THREE.Vector3().addVectors(nStartPos, sEndPos).multiplyScalar(0.5);
            let perpVector = new THREE.Vector3(Math.cos(item.angle), Math.sin(item.angle), 0).applyQuaternion(q);
            
            let offsetR = distance * 0.6;
            let midControlPoint = new THREE.Vector3().addVectors(mid, perpVector.multiplyScalar(offsetR));

            let curve = new THREE.CatmullRomCurve3([nStartPos, midControlPoint, sEndPos]);
            let curveCenter = curve.getPoint(0.5);
            
            // 遠近感（太さと透明度）の計算
            let distToCam = curveCenter.distanceTo(camPos);
            let t = THREE.MathUtils.clamp((distToCam - distance * 0.5) / (distance * 1.5), 0, 1);
            
            let tubeRadius = THREE.MathUtils.lerp(0.018, 0.005, t);
            let tubeOpacity = THREE.MathUtils.lerp(1.0, 0.2, t);
            
            let geometry = new THREE.TubeGeometry(curve, this.segments, tubeRadius, 6, false);
            
            item.entity.object3DMap.material.opacity = tubeOpacity;
            
            if (item.mesh) item.entity.object3D.remove(item.mesh);
            item.mesh = new THREE.Mesh(geometry, item.entity.object3DMap.material);
            item.entity.object3D.add(item.mesh);
          });
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" fog="type: exponential; color: #fff; density: 0.08">
    
    <a-marker id="n-pole" preset="hiro">
      <a-sphere radius="0.08" color="red"></a-sphere>
      <a-text value="N" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <a-marker id="s-pole" preset="kanji">
      <a-sphere radius="0.08" color="blue"></a-sphere>
      <a-text value="S" position="0 0.2 0" align="center" color="white"></a-text>
    </a-marker>

    <a-entity magnetic-field id="lines-container"></a-entity>
    
    <a-entity ambient-light="color: #888"></a-entity>
    <a-entity directional-light="color: #fff; intensity: 0.8" position="0 1 1"></a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
